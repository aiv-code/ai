version: '3.8'

services:
  metadata_db:
    image: postgres:15
    container_name: metadata_db
    environment:
      POSTGRES_DB: metadata_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d metadata_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g

  ollama_service:
    image: ollama/ollama:latest
    container_name: ollama_service
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_NUM_PARALLEL: 1
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 16g   # safe for llama3.1:8b

  analytics_api:
    build: ./backend
    container_name: analytics_api
    depends_on:
      metadata_db:
        condition: service_healthy
      ollama_service:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://admin:secure_password@metadata_db:5432/metadata_db
      OLLAMA_URL: http://ollama_service:11434
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          memory: 2g

  # frontend:
  #   build: ./frontend
  #   depends_on:
  #     - analytics_api
  #   ports:
  #     - "3000:3000"
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 1g

volumes:
  postgres_data:
  ollama_data:
